# Dainvo Office for Windows (x64): product identity and the slimmed-down
# feature set, matching DainvoMacOS.conf.
#
# Use it from autogen.input with:   INCLUDE:DainvoWindows
#
# Build in Cygwin with Visual Studio 2022 (see
# https://wiki.documentfoundation.org/Development/BuildingOnWindows), then
#     make && make instsetoo_native
# The MSI is in workdir/installation/DainvoOffice/msi/install/en-US.
# Code signing: add --enable-windows-build-signing and set PFXFILE,
# PFXPASSWORD (and optionally TIMESTAMPURL) in the environment.
# Keep machine-specific options (paths, parallelism, --with-branding) in your
# own autogen.input, which git ignores.

# Product identity and version
INCLUDE:DainvoVersion
--with-product-name=Dainvo Office
--with-vendor=Dainvo
--enable-release-build
--with-lang=en-US
--with-theme=colibre_svg colibre_dark_svg
--host=x86_64-pc-cygwin
--with-package-format=msi

# Not shipped: Java, help, API docs
--without-java
--without-help
--without-doxygen

# No database layer (see DainvoMacOS.conf)
--disable-database-connectivity

# No bundled Python
--enable-python=no

# Rarely used components (see DainvoMacOS.conf)
--disable-ldap
--disable-xmlhelp
--disable-libcmis
--disable-gpgmepp
--disable-lotuswordpro
--disable-sdremote

# No extension support. NOTE: LibreOffice ships its spelling dictionaries as
# bundled extensions and Windows has no system Hunspell dictionaries, so this
# build has no spell checking until dictionaries are added another way.
--disable-extensions
--disable-extension-integration

# Same feature cuts as macOS
--disable-poppler
--disable-opengl
--disable-opencl
--disable-draw-app
--disable-legacy-import-filters
