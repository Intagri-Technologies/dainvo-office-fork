# Dainvo Office for macOS: product identity and the slimmed-down feature set.
#
# Use it from autogen.input with:   INCLUDE:DainvoMacOS
#
# Release package (stripped .dmg, plus the unstripped libraries for crash
# symbolication in workdir/installation/DainvoOffice/dmg/symbols):
#     make && make instsetoo_native PKGFORMAT=dmg
# Keep machine-specific options (ccache, parallelism, PKG_CONFIG, the absolute
# --with-branding path) in your own autogen.input, which git ignores.

# Product identity
--with-product-name=Dainvo Office
--with-vendor=Dainvo
--with-macosx-bundle-identifier=com.dainvo.office
--enable-release-build
--with-lang=en-US
--with-theme=colibre colibre_svg colibre_dark colibre_dark_svg

# Not shipped: Java (Base wizards, Report Builder, JDBC), help, API docs
--without-java
--without-help
--without-doxygen

# No database layer: no Base, mail merge, data sources (F4), database
# fields, bibliography database, dBase files, form-control property editor
# or database drivers (ODBC, MySQL, CSV/Calc/Writer as data source).
# Opening and saving CSV, spreadsheets and documents is unaffected.
--disable-database-connectivity

# No bundled Python (~84 MB). Loses email mail merge, the Letter/Fax/Agenda
# wizards, LibreLogo and Python macros. Build scripts use a system python3
# (3.11 or newer), e.g. Homebrew's.
--enable-python=no

# Rarely used: LDAP config backend, help search index (help is off), CMIS
# remote servers, GPG signing (certificate and PDF signing stay, via NSS),
# Lotus Word Pro import, Impress Remote phone app
--disable-ldap
--disable-xmlhelp
--disable-libcmis
--disable-gpgmepp
--disable-lotuswordpro
--disable-sdremote

# No bundled extensions (no dictionaries or Solver are shipped), so skip
# integrating them; this also stops the help index tools (clucene) from
# being built and shipped. Users can still install extensions themselves.
--disable-extension-integration

# Obsolete import formats: old Mac (ClarisWorks, MacWrite, WriteNow...),
# StarOffice 1-5, MS Works/Write/DOS Word/Pocket Word/Multiplan, WordPerfect
# (text and graphics), T602, Hangul 97. Apple iWork, Visio, Publisher,
# CorelDraw, AbiWord, e-books and EPUB stay.
--disable-legacy-import-filters
