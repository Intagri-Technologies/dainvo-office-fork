# Dainvo Office version, shared by the macOS, Windows and Linux configs.
#
# Same scheme as the Dainvo app (package.json "version" + "dainvoBuildNumber"):
# a semantic version, plus a build number that always increases and is never
# reused, even for a rebuild of the same version. The updater compares build
# numbers. Change both with:   dainvo/tools/release.py prepare <version> <build>
#
# LibreOffice's own version (AC_INIT / LIBO_VERSION_*) stays as it is, because
# extensions and user profiles depend on it.
--with-dainvo-version=0.1.0
--with-dainvo-build=102

# Updates: Sparkle 2 (macOS), WinSparkle (Windows), built-in notice (Linux).
# All read the signed appcast.xml attached to the latest published release.
# The public key matches the private key "dainvo-office" in the release
# owner's macOS keychain (Sparkle generate_keys --account dainvo-office).
# See dainvo/docs/RELEASES.md before ever changing it.
--enable-dainvo-updater
--with-dainvo-update-feed=https://github.com/Intagri-Technologies/dainvo-office-releases/releases/latest/download/appcast.xml
--with-dainvo-update-key=kSL50bY7Z844U1dZmET4eWGhSEOZyQo2WEG/FduYtTo=
