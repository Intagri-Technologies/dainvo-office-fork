# Dainvo Office for Linux (x86_64): product identity and the slimmed-down
# feature set, matching DainvoMacOS.conf.
#
# Use it from autogen.input with:   INCLUDE:DainvoLinux
#
# Release packages (.tar.gz, .deb, .rpm) are made from the build with
#     make && dainvo/packaging/linux/package.sh
# (see dainvo/docs/RELEASES.md). The CI workflow .github/workflows/release.yml
# builds on Ubuntu 22.04, so the packages need glibc 2.35 or newer
# (Debian 12, Fedora 36, Ubuntu 22.04, current Arch).
# Keep machine-specific options (ccache, parallelism, the absolute
# --with-branding path) in your own autogen.input, which git ignores.

# Product identity and version
INCLUDE:DainvoVersion
--with-product-name=Dainvo Office
--with-vendor=Dainvo
--enable-release-build
--with-lang=en-US
--with-theme=colibre_svg colibre_dark_svg

# Not shipped: Java, help, API docs
--without-java
--without-help
--without-doxygen

# No database layer (see DainvoMacOS.conf)
--disable-database-connectivity

# No bundled Python
--enable-python=no

# Rarely used components (see DainvoMacOS.conf)
--disable-ldap
--disable-xmlhelp
--disable-libcmis
--disable-gpgmepp
--disable-lotuswordpro
--disable-sdremote

# No extension support. Spell checking, hyphenation and the thesaurus use the
# distribution's dictionaries (hunspell-en-us / hunspell-en-US etc.), which
# the .deb and .rpm recommend.
--disable-extensions
--disable-extension-integration
--with-system-dicts
--with-external-dict-dir=/usr/share/hunspell
--with-external-hyph-dir=/usr/share/hyphen
--with-external-thes-dir=/usr/share/mythes

# Same feature cuts as macOS
--disable-poppler
--disable-opengl
--disable-opencl
--disable-draw-app
--disable-legacy-import-filters

# Desktop integration: GTK 3 only (works on GNOME, KDE and others), no Qt/KDE
# or GTK 4 plugins, no Evolution address book, no Avahi (Impress Remote is off).
--enable-gtk3
--disable-gtk4
--disable-qt5
--disable-qt6
--disable-kf5
--disable-kf6
--disable-gtk3-kde5
--disable-evolution2
--disable-avahi
--disable-dconf
--enable-dbus

# Build against the system zlib like LibreOffice's own Linux builds; every
# other library is bundled so one package works across distributions.
--with-system-zlib
--with-linker-hash-style=both
