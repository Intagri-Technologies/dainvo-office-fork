name: Verify Office release signing
on: workflow_dispatch
permissions:
  contents: read
jobs:
  macos:
    name: Developer ID signing and notarization
    runs-on: macos-15
    timeout-minutes: 20
    environment: release
    steps:
      - name: Sign and notarize a test binary
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          umask 077
          work=$(mktemp -d "$RUNNER_TEMP/office-signing.XXXXXX")
          keychain="$work/test.keychain-db"
          trap 'security delete-keychain "$keychain" >/dev/null 2>&1 || true; rm -rf "$work"' EXIT
          password=$(openssl rand -hex 16)
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$work/cert.p12"
          security import "$work/cert.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$work/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/"Developer ID Application: / && !found { print $2; found=1 }')
          test -n "$identity"
          cd "$work"
          printf '%s\n' 'int main(void) { return 0; }' | xcrun clang -x c -o office-signing-test -
          echo "Signing the test executable"
          codesign --force --options runtime --timestamp --sign "$identity" office-signing-test
          codesign --verify --strict office-signing-test
          mkdir payload
          mv office-signing-test payload/
          hdiutil create -quiet -format UDZO -volname 'Office signing test' -srcfolder payload office-signing-test.dmg
          echo "Signing the test DMG"
          codesign --force --timestamp --sign "$identity" office-signing-test.dmg
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$work/notary.p8"
          echo "Submitting the test DMG to Apple"
          xcrun notarytool submit office-signing-test.dmg --key "$work/notary.p8" \
            --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait --timeout 12m --output-format json > result.json
          jq -e '.status == "Accepted"' result.json
          xcrun stapler staple office-signing-test.dmg
          xcrun stapler validate office-signing-test.dmg
  windows:
    name: Azure Artifact Signing with GitHub OIDC
    runs-on: windows-2022
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Compile a test executable
        shell: pwsh
        run: |
          Set-Content -Path test.cs -Value 'public static class Test { public static void Main() { } }'
          & "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /nologo /out:office-signing-test.exe test.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        env:
          AZURE_CORE_OUTPUT: none
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Sign the test executable
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          exclude-environment-credential: true
          exclude-azure-cli-credential: false
          files: ${{ github.workspace }}\office-signing-test.exe
      - name: Verify the signature and timestamp
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\signtool.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } -Descending | Select-Object -First 1
          & $signtool.FullName verify /pa /tw office-signing-test.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
